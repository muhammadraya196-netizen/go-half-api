version: "2"
sql:
  - engine: postgresql
    queries: db/query
    schema: db/schema.sql
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        emit_db_tags: true
        overrides:
          - db_type: "pg_catalog.numeric"
            nullable: false
            go_type: "int64"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
          - column: "products.rating"
            go_type:
              type: "float64"
              pointer: true
          - db_type: "pg_catalog.jsonb"
            go_type:
              import: "encoding/json"
              type: "json.RawMessage"
